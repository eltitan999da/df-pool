<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DF Pools</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#eef7fb;
    color:#123;
}

header{
    background:#087ea4;
    color:white;
    padding:18px;
    text-align:center;
}

header h1{
    margin:0;
    font-size:28px;
}

header p{
    margin:5px 0 0;
    opacity:.9;
}

.container{
    max-width:700px;
    margin:auto;
    padding:15px;
}

.card{
    background:white;
    border-radius:15px;
    padding:16px;
    margin-bottom:15px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.stats{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.stat{
    padding:15px;
    border-radius:12px;
    background:#e8f6fb;
}

.stat strong{
    display:block;
    font-size:20px;
    margin-top:5px;
}

button{
    border:0;
    border-radius:10px;
    padding:12px 15px;
    font-size:15px;
    cursor:pointer;
}

.primary{
    background:#087ea4;
    color:white;
}

.success{
    background:#20a05a;
    color:white;
}

.danger{
    background:#d94a4a;
    color:white;
}

.secondary{
    background:#e5edf0;
    color:#123;
}

input,select{
    width:100%;
    padding:12px;
    margin:6px 0 12px;
    border:1px solid #ccd9de;
    border-radius:9px;
    font-size:16px;
}

label{
    font-weight:bold;
}

.client{
    border:1px solid #dbe7eb;
    border-radius:12px;
    padding:14px;
    margin-top:10px;
}

.client-name{
    font-size:19px;
    font-weight:bold;
}

.amount{
    font-size:18px;
    margin:6px 0;
}

.paid{
    color:#168447;
    font-weight:bold;
}

.pending{
    color:#c0392b;
    font-weight:bold;
}

.actions{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
    margin-top:10px;
}

.hidden{
    display:none;
}

.month-title{
    font-size:20px;
    font-weight:bold;
    margin-bottom:10px;
}

.empty{
    text-align:center;
    padding:25px;
    color:#667;
}
</style>
</head>

<body>

<header>
    <h1>🏊 DF POOLS</h1>
    <p>Control de clientes y cobros</p>
</header>

<div class="container">

<div class="card">
    <div class="month-title" id="monthTitle"></div>

    <div class="stats">
        <div class="stat">
            Clientes
            <strong id="totalClients">0</strong>
        </div>

        <div class="stat">
            Pendientes
            <strong id="totalPending">$0</strong>
        </div>

        <div class="stat">
            Cobrado
            <strong id="totalPaid">$0</strong>
        </div>

        <div class="stat">
            Total del mes
            <strong id="totalMonth">$0</strong>
        </div>
    </div>
</div>

<div class="card">
    <button class="primary" onclick="showAdd()">➕ Agregar cliente</button>
</div>

<div class="card hidden" id="formCard">

    <h2 id="formTitle">Nuevo cliente</h2>

    <label>Nombre</label>
    <input id="name" placeholder="Nombre del cliente">

    <label>Teléfono</label>
    <input id="phone" placeholder="Teléfono">

    <label>Importe mensual</label>
    <input id="amount" type="number" placeholder="Ej: 100000">

    <button class="primary" onclick="saveClient()">Guardar</button>
    <button class="secondary" onclick="hideForm()">Cancelar</button>
</div>

<div class="card">
    <input id="search" placeholder="🔎 Buscar cliente..." oninput="render()">
</div>

<div class="card">
    <h2>Clientes</h2>
    <div id="clients"></div>
</div>

<div class="card">
    <h2>Historial</h2>

    <label>Consultar mes</label>
    <input id="historyMonth" type="month" onchange="renderHistory()">

    <div id="history"></div>
</div>

</div>

<script>

let clients = JSON.parse(localStorage.getItem("dfpools_clients") || "[]");

let payments = JSON.parse(localStorage.getItem("dfpools_payments") || "[]");

let editingId = null;

const today = new Date();

const currentMonth =
    today.getFullYear() + "-" +
    String(today.getMonth()+1).padStart(2,"0");

document.getElementById("historyMonth").value = currentMonth;

document.getElementById("monthTitle").textContent =
    "📅 " + today.toLocaleDateString("es-AR",{
        month:"long",
        year:"numeric"
    });

function money(value){
    return new Intl.NumberFormat("es-AR",{
        style:"currency",
        currency:"ARS",
        maximumFractionDigits:0
    }).format(value || 0);
}

function saveData(){
    localStorage.setItem(
        "dfpools_clients",
        JSON.stringify(clients)
    );

    localStorage.setItem(
        "dfpools_payments",
        JSON.stringify(payments)
    );
}

function showAdd(){

    editingId = null;

    document.getElementById("formTitle").textContent =
        "Nuevo cliente";

    document.getElementById("name").value = "";
    document.getElementById("phone").value = "";
    document.getElementById("amount").value = "";

    document.getElementById("formCard")
        .classList.remove("hidden");
}

function hideForm(){
    document.getElementById("formCard")
        .classList.add("hidden");
}

function saveClient(){

    const name =
        document.getElementById("name").value.trim();

    const phone =
        document.getElementById("phone").value.trim();

    const amount =
        Number(document.getElementById("amount").value);

    if(!name){
        alert("Poné el nombre del cliente.");
        return;
    }

    if(!amount || amount <= 0){
        alert("Poné un importe mensual válido.");
        return;
    }

    if(editingId){

        const client =
            clients.find(c => c.id === editingId);

        if(client){

            if(Number(client.amount) !== amount){

                client.priceHistory =
                    client.priceHistory || [];

                client.priceHistory.push({
                    amount: amount,
                    from: currentMonth
                });
            }

            client.name = name;
            client.phone = phone;
            client.amount = amount;
        }

    }else{

        clients.push({

            id: Date.now(),

            name:name,

            phone:phone,

            amount:amount,

            created:currentMonth,

            priceHistory:[
                {
                    amount:amount,
                    from:currentMonth
                }
            ]

        });
    }

    saveData();

    hideForm();

    render();
}

function editClient(id){

    const client =
        clients.find(c => c.id === id);

    if(!client)return;

    editingId = id;

    document.getElementById("formTitle").textContent =
        "Editar cliente";

    document.getElementById("name").value =
        client.name;

    document.getElementById("phone").value =
        client.phone || "";

    document.getElementById("amount").value =
        client.amount;

    document.getElementById("formCard")
        .classList.remove("hidden");

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}

function deleteClient(id){

    const client =
        clients.find(c => c.id === id);

    if(!client)return;

    if(confirm(
        "¿Eliminar a " +
        client.name +
        "?"
    )){

        clients =
            clients.filter(c => c.id !== id);

        payments =
            payments.filter(p => p.clientId !== id);

        saveData();

        render();
    }
}

function getPriceForMonth(client, month){

    if(!client.priceHistory){
        return client.amount;
    }

    let selected =
        client.priceHistory[0];

    for(const price of client.priceHistory){

        if(price.from <= month){
            selected = price;
        }
    }

    return selected.amount;
}

function isPaid(clientId,month){

    return payments.some(
        p =>
        p.clientId === clientId &&
        p.month === month
    );
}

function markPaid(id){

    if(isPaid(id,currentMonth)){

        payments =
            payments.filter(
                p =>
                !(
                    p.clientId === id &&
                    p.month === currentMonth
                )
            );

    }else{

        payments.push({

            clientId:id,

            month:currentMonth,

            date:new Date().toISOString()

        });
    }

    saveData();

    render();
}

function render(){

    const container =
        document.getElementById("clients");

    const search =
        document.getElementById("search")
            .value
            .toLowerCase();

    const filtered =
        clients.filter(c =>
            c.name.toLowerCase()
