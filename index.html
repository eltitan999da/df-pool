<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DF Pools</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,sans-serif;
background:#eef7fb;
color:#123;
}
header{
background:#087ea4;
color:white;
padding:18px;
text-align:center;
}
header h1{margin:0;font-size:28px}
header p{margin:5px 0 0}
.container{max-width:700px;margin:auto;padding:15px}
.card{
background:white;
border-radius:15px;
padding:16px;
margin-bottom:15px;
box-shadow:0 3px 12px rgba(0,0,0,.08);
}
.stats{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}
.stat{
padding:14px;
border-radius:12px;
background:#e8f6fb;
}
.stat strong{
display:block;
font-size:20px;
margin-top:5px;
}
button{
border:0;
border-radius:10px;
padding:12px 15px;
font-size:15px;
margin:3px;
}
.primary{background:#087ea4;color:white}
.success{background:#20a05a;color:white}
.danger{background:#d94a4a;color:white}
.secondary{background:#e5edf0;color:#123}
input,select{
width:100%;
padding:12px;
margin:6px 0 12px;
border:1px solid #ccd9de;
border-radius:9px;
font-size:16px;
}
label{font-weight:bold}
.client{
border:1px solid #dbe7eb;
border-radius:12px;
padding:14px;
margin-top:10px;
}
.client-name{
font-size:19px;
font-weight:bold;
}
.amount{
font-size:18px;
margin:6px 0;
}
.paid{
color:#168447;
font-weight:bold;
}
.pending{
color:#c0392b;
font-weight:bold;
}
.hidden{display:none}
.actions{
display:flex;
gap:5px;
flex-wrap:wrap;
margin-top:10px;
}
.empty{
text-align:center;
padding:20px;
color:#667;
}
.history-box{
border-top:1px solid #ddd;
padding-top:10px;
margin-top:10px;
}
</style>
</head>

<body>

<header>
<h1>🏊 DF POOLS</h1>
<p>Clientes y cobros</p>
</header>

<div class="container">

<div class="card">
<div id="monthTitle"></div>

<div class="stats">

<div class="stat">
Clientes
<strong id="totalClients">0</strong>
</div>

<div class="stat">
Cobrado
<strong id="totalPaid">$0</strong>
</div>

<div class="stat">
Pendiente
<strong id="totalPending">$0</strong>
</div>

<div class="stat">
Total mes
<strong id="totalMonth">$0</strong>
</div>

</div>
</div>

<div class="card">
<button class="primary" onclick="showForm()">
➕ Agregar cliente
</button>
</div>

<div class="card hidden" id="formCard">

<h2 id="formTitle">Nuevo cliente</h2>

<label>Nombre</label>
<input id="name" placeholder="Nombre del cliente">

<label>Teléfono</label>
<input id="phone" placeholder="Teléfono">

<label>Importe mensual</label>
<input id="amount" type="number" placeholder="Ej: 100000">

<button class="primary" onclick="saveClient()">💾 Guardar</button>
<button class="secondary" onclick="closeForm()">Cancelar</button>

</div>

<div class="card">

<input
id="search"
placeholder="🔎 Buscar cliente"
oninput="renderClients()"
>

</div>

<div class="card">

<h2>👥 Clientes</h2>

<div id="clients"></div>

</div>

<div class="card">

<h2>📜 Historial</h2>

<label>Mes</label>

<input
id="historyMonth"
type="month"
onchange="renderHistory()"
>

<div id="history"></div>

</div>

</div>

<script>

let clients=
JSON.parse(localStorage.getItem("df_clients")||"[]");

let payments=
JSON.parse(localStorage.getItem("df_payments")||"[]");

let editingId=null;

function currentMonth(){

let d=new Date();

return d.getFullYear()+"-"+
String(d.getMonth()+1).padStart(2,"0");

}

function money(n){

return new Intl.NumberFormat("es-AR",{
style:"currency",
currency:"ARS",
maximumFractionDigits:0
}).format(Number(n)||0);

}

function saveData(){

localStorage.setItem(
"df_clients",
JSON.stringify(clients)
);

localStorage.setItem(
"df_payments",
JSON.stringify(payments)
);

}

function showForm(){

editingId=null;

document.getElementById("formTitle")
.textContent="Nuevo cliente";

document.getElementById("name").value="";
document.getElementById("phone").value="";
document.getElementById("amount").value="";

document.getElementById("formCard")
.classList.remove("hidden");

window.scrollTo({
top:0,
behavior:"smooth"
});

}

function closeForm(){

document.getElementById("formCard")
.classList.add("hidden");

}

function saveClient(){

let name=
document.getElementById("name")
.value.trim();

let phone=
document.getElementById("phone")
.value.trim();

let amount=
Number(document.getElementById("amount").value);

if(!name){

alert("Ingresá el nombre.");

return;

}

if(!amount||amount<=0){

alert("Ingresá un importe válido.");

return;

}

if(editingId){

let c=
clients.find(x=>x.id===editingId);

if(c){

if(Number(c.amount)!==amount){

c.priceHistory=
c.priceHistory||[];

c.priceHistory.push({

amount:amount,

from:currentMonth()

});

}

c.name=name;
c.phone=phone;
c.amount=amount;

}

}else{

clients.push({

id:Date.now(),

name:name,

phone:phone,

amount:amount,

created:currentMonth(),

priceHistory:[{

amount:amount,

from:currentMonth()

}]

});

}

saveData();

closeForm();

render();

}

function editClient(id){

let c=
clients.find(x=>x.id===id);

if(!c)return;

editingId=id;

document.getElementById("formTitle")
.textContent="Editar cliente";

document.getElementById("name")
.value=c.name;

document.getElementById("phone")
.value=c.phone||"";

document.getElementById("amount")
.value=c.amount;

document.getElementById("formCard")
.classList.remove("hidden");

window.scrollTo({
top:0,
behavior:"smooth"
});

}

function deleteClient(id){

let c=
clients.find(x=>x.id===id);

if(!c)return;

if(confirm("¿Eliminar a "+c.name+"?")){

clients=
clients.filter(x=>x.id!==id);

payments=
payments.filter(x=>x.clientId!==id);

saveData();

render();

}

}

function priceForMonth(c,month){

if(!c.priceHistory||
c.priceHistory.length===0){

return c.amount;

}

let selected=
c.priceHistory[0];

for(let p of c.priceHistory){

if(p.from<=month){

selected=p;

}

}

return selected.amount;

}

function isPaid(id,month){

return payments.some(p=>
p.clientId===id&&
p.month===month
);

}

function togglePaid(id){

let month=currentMonth();

let index=
payments.findIndex(p=>
p.clientId===id&&
p.month===month
);

if(index>=0){

payments.splice(index,1);

}else{

payments.push({

clientId:id,

month:month,

date:new Date().toISOString()

});

}

saveData();

render();

}

function renderClients(){

let box=
document.getElementById("clients");

let search=
document.getElementById("search")
.value
.toLowerCase();

box.innerHTML="";

let list=
clients.filter(c=>
c.name.toLowerCase().includes(search)
);

if(list.length===0){

box.innerHTML=
'<div class="empty">No hay clientes.</div>';

return;

}

for(let c of list){

let price=
priceForMonth(c,currentMonth());

let paid=
isPaid(c.id,currentMonth());

let div=
document.createElement("div");

div.className="client";

div.innerHTML=`

<div class="client-name">
${safe(c.name)}
</div>

${c.phone?
`<div>📞 ${safe(c.phone)}</div>`:""}

<div class="amount">
${money(price)} / mes
</div>

<div class="${paid?"paid":"pending"}">
${paid?"✅ PAGÓ":"❌ PENDIENTE"}
</div>

<div class="actions">

<button
class="${paid?"secondary":"success"}"
onclick="togglePaid(${c.id})">

${paid?"↩️ Desmarcar":"✅ Marcar pagado"}

</button>

<button
class="secondary"
onclick="editClient(${c.id})">

✏️ Editar

</button>

<button
class="danger"
onclick="deleteClient(${c.id})">

🗑️ Borrar

</button>

</div>

`;

box.appendChild(div);

}

}

function renderStats(){

let month=currentMonth();

let total=0;

let paid=0;

for(let c of clients){

let price=
priceForMonth(c,month);

total+=price;

if(isPaid(c.id,month)){

paid+=price;

}

}

document.getElementById("totalClients")
.textContent=clients.length;

document.getElementById("totalMonth")
.textContent=money(total);

document.getElementById("totalPaid")
.textContent=money(paid);

document.getElementById("totalPending")
.textContent=money(total-paid);

let d=new Date();

document.getElementById("monthTitle")
.textContent=
"📅 "+
d.toLocaleDateString("es-AR",{
month:"long",
year:"numeric"
});

}

function renderHistory(){

let month=
document.getElementById("historyMonth")
.value;

let box=
document.getElementById("history");

box.innerHTML="";

if(!month)return;

if(clients.length===0){

box.innerHTML=
'<div class="empty">No hay clientes.</div>';

return;

}

let total=0;

let paid=0;

for(let c of clients){

let price=
priceForMonth(c,month);

let ok=
isPaid(c.id,month);

total+=price;

if(ok)paid+=price;

let div=
document.createElement("div");

div.className="history-box";

div.innerHTML=`

<strong>
${safe(c.name)}
</strong>

<br>

${money(price)}

<br>

<span class="${ok?"paid":"pending"}">

${ok?"✅ Pagado":"❌ Pendiente"}

</span>

`;

box.appendChild(div);

}

let summary=
document.createElement("div");

summary.className="client";

summary.innerHTML=`

<strong>Resumen del mes</strong>

<p>
Total: ${money(total)}
</p>

<p class="paid">
Cobrado: ${money(paid)}
</p>

<p class="pending">
Pendiente: ${money(total-paid)}
</p>

`;

box.prepend(summary);

}

function safe(text){

return String(text)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

function render(){

renderStats();

renderClients();

renderHistory();

}

document.getElementById("historyMonth")
.value=currentMonth();

render();

</script>

</body>
</html>
